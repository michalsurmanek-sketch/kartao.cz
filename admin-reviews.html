<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Správa Recenzí | Kartao.cz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared-auth.js" defer></script>
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-active { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
    .status-reported { background: rgba(234, 179, 8, 0.2); color: #eab308; }
    .status-hidden { background: rgba(107, 114, 128, 0.2); color: #6b7280; }
    .status-removed { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    
    .review-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      transition: all 0.3s;
    }
    .review-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(168, 85, 247, 0.3);
    }
    .stat-card {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(59, 130, 246, 0.1));
      border: 1px solid rgba(168, 85, 247, 0.2);
      border-radius: 1rem;
      padding: 1.5rem;
    }
    .tab-btn {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      transition: all 0.3s;
      font-weight: 500;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #a855f7, #3b82f6);
      color: white;
    }
    .tab-btn:not(.active) {
      color: rgba(255, 255, 255, 0.6);
    }
    .tab-btn:not(.active):hover {
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body class="text-white">

  <!-- Header -->
  <header class="border-b border-white/10 bg-black/20 backdrop-blur-md sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a href="index.html" class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-blue-400 bg-clip-text text-transparent">
            Kartao.cz Admin
          </a>
          <span class="text-xs px-3 py-1 rounded-full bg-red-500/20 text-red-400 border border-red-500/30">
            <i data-lucide="shield" class="w-3 h-3 inline"></i> Admin Panel
          </span>
        </div>
        <div class="flex items-center gap-4">
          <a href="index.html" class="text-white/60 hover:text-white transition text-sm">
            <i data-lucide="arrow-left" class="w-4 h-4 inline"></i> Zpět na web
          </a>
          <button id="logoutBtn" class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition text-sm">
            Odhlásit se
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="container mx-auto px-4 py-8">
    
    <!-- Statistics -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
      <div class="stat-card">
        <div class="flex items-center justify-between mb-2">
          <span class="text-white/60 text-sm">Celkem recenzí</span>
          <i data-lucide="star" class="w-5 h-5 text-yellow-400"></i>
        </div>
        <div class="text-3xl font-bold" id="totalReviews">-</div>
      </div>
      
      <div class="stat-card">
        <div class="flex items-center justify-between mb-2">
          <span class="text-white/60 text-sm">Nahlášené</span>
          <i data-lucide="flag" class="w-5 h-5 text-yellow-400"></i>
        </div>
        <div class="text-3xl font-bold text-yellow-400" id="reportedReviews">-</div>
      </div>
      
      <div class="stat-card">
        <div class="flex items-center justify-between mb-2">
          <span class="text-white/60 text-sm">Skryté</span>
          <i data-lucide="eye-off" class="w-5 h-5 text-gray-400"></i>
        </div>
        <div class="text-3xl font-bold text-gray-400" id="hiddenReviews">-</div>
      </div>
      
      <div class="stat-card">
        <div class="flex items-center justify-between mb-2">
          <span class="text-white/60 text-sm">Odstraněné</span>
          <i data-lucide="trash-2" class="w-5 h-5 text-red-400"></i>
        </div>
        <div class="text-3xl font-bold text-red-400" id="removedReviews">-</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex gap-2 mb-6">
      <button class="tab-btn active" data-tab="reported" onclick="switchTab('reported')">
        <i data-lucide="flag" class="w-4 h-4 inline"></i> Nahlášené
      </button>
      <button class="tab-btn" data-tab="all" onclick="switchTab('all')">
        <i data-lucide="list" class="w-4 h-4 inline"></i> Všechny recenze
      </button>
      <button class="tab-btn" data-tab="hidden" onclick="switchTab('hidden')">
        <i data-lucide="eye-off" class="w-4 h-4 inline"></i> Skryté
      </button>
    </div>

    <!-- Filters -->
    <div class="mb-6 flex gap-4 flex-wrap items-center">
      <select id="reasonFilter" class="px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white focus:outline-none focus:border-purple-500 transition">
        <option value="">Všechny důvody</option>
        <option value="spam">🚫 Spam</option>
        <option value="offensive">🚫 Urážlivý obsah</option>
        <option value="fake">🚫 Nepravdivá recenze</option>
        <option value="other">🚫 Jiný důvod</option>
      </select>
      
      <select id="sortBy" class="px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white focus:outline-none focus:border-purple-500 transition">
        <option value="newest">Nejnovější</option>
        <option value="oldest">Nejstarší</option>
        <option value="rating-high">Nejvyšší hodnocení</option>
        <option value="rating-low">Nejnižší hodnocení</option>
      </select>

      <button onclick="loadReviews()" class="px-4 py-2 rounded-lg bg-purple-500 hover:bg-purple-600 transition">
        <i data-lucide="refresh-cw" class="w-4 h-4 inline"></i> Obnovit
      </button>
    </div>

    <!-- Reviews List -->
    <div id="reviewsContainer" class="space-y-4">
      <div class="text-center py-12 text-white/40">
        <i data-lucide="loader" class="w-8 h-8 inline animate-spin"></i>
        <p class="mt-2">Načítání recenzí...</p>
      </div>
    </div>

  </div>

  <!-- Modal pro admin notes -->
  <div id="notesModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4">
    <div class="bg-gradient-to-br from-purple-900/90 to-blue-900/90 rounded-2xl max-w-md w-full border border-purple-500/20 shadow-2xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-bold text-white flex items-center gap-2">
          <i data-lucide="file-text" class="w-5 h-5 text-purple-400"></i>
          Admin poznámky
        </h3>
        <button onclick="closeNotesModal()" class="text-white/60 hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <textarea id="adminNotesText" 
                class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:border-purple-500 transition resize-none mb-4" 
                rows="5" 
                placeholder="Přidat interní poznámku..."></textarea>

      <div class="flex gap-3">
        <button onclick="closeNotesModal()" 
                class="flex-1 px-4 py-3 rounded-lg bg-white/10 hover:bg-white/20 text-white font-medium transition">
          Zrušit
        </button>
        <button id="saveNotesBtn" 
                class="flex-1 px-4 py-3 rounded-lg bg-gradient-to-r from-purple-500 to-blue-500 hover:from-purple-600 hover:to-blue-600 text-white font-medium transition">
          Uložit
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'reported';
    let currentReviewIdForNotes = null;

    // Admin check
    async function checkAdminAccess() {
      const { data: { user } } = await window.supabaseClient.auth.getUser();
      if (!user) {
        alert('Musíte být přihlášeni jako admin');
        window.location.href = '/login.html';
        return false;
      }
      
      // TODO: Implementovat kontrolu admin role
      // Můžeš zkontrolovat v databázi nebo JWT tokenu
      console.log('Admin user:', user.email);
      return true;
    }

    // Load statistics
    async function loadStatistics() {
      try {
        const { data: reviews, error } = await window.supabaseClient
          .from('reviews')
          .select('status');

        if (error) throw error;

        const stats = {
          total: reviews.length,
          reported: reviews.filter(r => r.status === 'reported').length,
          hidden: reviews.filter(r => r.status === 'hidden').length,
          removed: reviews.filter(r => r.status === 'removed').length
        };

        document.getElementById('totalReviews').textContent = stats.total;
        document.getElementById('reportedReviews').textContent = stats.reported;
        document.getElementById('hiddenReviews').textContent = stats.hidden;
        document.getElementById('removedReviews').textContent = stats.removed;
      } catch (error) {
        console.error('Chyba při načítání statistik:', error);
      }
    }

    // Load reviews
    async function loadReviews() {
      const container = document.getElementById('reviewsContainer');
      container.innerHTML = '<div class="text-center py-12 text-white/40"><i data-lucide="loader" class="w-8 h-8 inline animate-spin"></i><p class="mt-2">Načítání...</p></div>';
      if (window.lucide) lucide.createIcons();

      try {
        let query = window.supabaseClient
          .from('reviews')
          .select('*');

        // Filter by tab
        if (currentTab === 'reported') {
          query = query.eq('status', 'reported');
        } else if (currentTab === 'hidden') {
          query = query.eq('status', 'hidden');
        }

        // Filter by reason
        const reasonFilter = document.getElementById('reasonFilter').value;
        if (reasonFilter) {
          query = query.ilike('reported_reason', `%${reasonFilter}%`);
        }

        // Sort
        const sortBy = document.getElementById('sortBy').value;
        if (sortBy === 'newest') {
          query = query.order('created_at', { ascending: false });
        } else if (sortBy === 'oldest') {
          query = query.order('created_at', { ascending: true });
        } else if (sortBy === 'rating-high') {
          query = query.order('rating', { ascending: false });
        } else if (sortBy === 'rating-low') {
          query = query.order('rating', { ascending: true });
        }

        const { data: reviews, error } = await query;

        if (error) throw error;

        if (reviews.length === 0) {
          container.innerHTML = `
            <div class="text-center py-12 text-white/40">
              <i data-lucide="inbox" class="w-12 h-12 inline mb-4"></i>
              <p>Žádné recenze k zobrazení</p>
            </div>
          `;
          if (window.lucide) lucide.createIcons();
          return;
        }

        container.innerHTML = reviews.map(review => `
          <div class="review-card p-6">
            <div class="flex items-start justify-between mb-4">
              <div class="flex items-start gap-4 flex-1">
                <img src="${review.company_logo || 'https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=60&h=60&fit=crop'}" 
                     alt="${review.company_name}" 
                     class="w-12 h-12 rounded-lg object-cover">
                <div class="flex-1">
                  <div class="flex items-center gap-2 mb-1">
                    <span class="font-semibold">${review.company_name}</span>
                    <span class="status-badge status-${review.status}">
                      ${review.status === 'active' ? '✓ Aktivní' : 
                        review.status === 'reported' ? '⚠ Nahlášeno' :
                        review.status === 'hidden' ? '👁 Skryto' : '🗑 Odstraněno'}
                    </span>
                  </div>
                  <div class="flex items-center gap-1 mb-2">
                    ${[...Array(5)].map((_, i) => `
                      <i data-lucide="star" class="w-4 h-4 ${i < review.rating ? 'text-yellow-400 fill-yellow-400' : 'text-white/20'}"></i>
                    `).join('')}
                    <span class="text-sm text-white/60 ml-2">${review.rating}/5</span>
                  </div>
                  ${review.title ? `<div class="font-medium mb-1">${review.title}</div>` : ''}
                  <p class="text-white/80 text-sm">${review.comment || '<em class="text-white/40">Bez komentáře</em>'}</p>
                  
                  ${review.reported_reason ? `
                    <div class="mt-3 p-3 rounded-lg bg-red-500/10 border border-red-500/20">
                      <div class="flex items-center gap-2 mb-1">
                        <i data-lucide="flag" class="w-4 h-4 text-red-400"></i>
                        <span class="text-sm font-medium text-red-400">Důvod nahlášení</span>
                      </div>
                      <p class="text-sm text-white/80">${review.reported_reason}</p>
                      ${review.reported_at ? `<p class="text-xs text-white/50 mt-1">Nahlášeno: ${new Date(review.reported_at).toLocaleString('cs-CZ')}</p>` : ''}
                    </div>
                  ` : ''}
                  
                  ${review.admin_notes ? `
                    <div class="mt-3 p-3 rounded-lg bg-purple-500/10 border border-purple-500/20">
                      <div class="flex items-center gap-2 mb-1">
                        <i data-lucide="file-text" class="w-4 h-4 text-purple-400"></i>
                        <span class="text-sm font-medium text-purple-400">Admin poznámky</span>
                      </div>
                      <p class="text-sm text-white/80">${review.admin_notes}</p>
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>

            <div class="flex gap-2 flex-wrap">
              ${review.status === 'reported' || review.status === 'active' ? `
                <button onclick="updateReviewStatus('${review.id}', 'hidden')" 
                        class="px-3 py-2 rounded-lg bg-gray-500/20 hover:bg-gray-500/30 text-gray-300 text-sm transition">
                  <i data-lucide="eye-off" class="w-4 h-4 inline"></i> Skrýt
                </button>
              ` : ''}
              
              ${review.status !== 'removed' ? `
                <button onclick="updateReviewStatus('${review.id}', 'removed')" 
                        class="px-3 py-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-300 text-sm transition">
                  <i data-lucide="trash-2" class="w-4 h-4 inline"></i> Odstranit
                </button>
              ` : ''}
              
              ${review.status !== 'active' ? `
                <button onclick="updateReviewStatus('${review.id}', 'active')" 
                        class="px-3 py-2 rounded-lg bg-green-500/20 hover:bg-green-500/30 text-green-300 text-sm transition">
                  <i data-lucide="check" class="w-4 h-4 inline"></i> Označit jako platnou
                </button>
              ` : ''}
              
              <button onclick="openNotesModal('${review.id}', '${(review.admin_notes || '').replace(/'/g, "\\'")}', '${review.company_name}')" 
                      class="px-3 py-2 rounded-lg bg-purple-500/20 hover:bg-purple-500/30 text-purple-300 text-sm transition">
                <i data-lucide="file-text" class="w-4 h-4 inline"></i> ${review.admin_notes ? 'Upravit poznámky' : 'Přidat poznámky'}
              </button>
              
              <div class="ml-auto text-xs text-white/40">
                Vytvořeno: ${new Date(review.created_at).toLocaleString('cs-CZ')}
              </div>
            </div>
          </div>
        `).join('');

        if (window.lucide) lucide.createIcons();
      } catch (error) {
        console.error('Chyba při načítání recenzí:', error);
        container.innerHTML = '<div class="text-center py-12 text-red-400">Chyba při načítání recenzí</div>';
      }
    }

    // Update review status
    async function updateReviewStatus(reviewId, newStatus) {
      const confirmMessages = {
        hidden: 'Opravdu chcete tuto recenzi skrýt?',
        removed: 'Opravdu chcete tuto recenzi trvale odstranit?',
        active: 'Opravdu chcete tuto recenzi označit jako platnou?'
      };

      if (!confirm(confirmMessages[newStatus])) return;

      try {
        const { error } = await window.supabaseClient
          .from('reviews')
          .update({ status: newStatus })
          .eq('id', reviewId);

        if (error) throw error;

        showNotification(`Recenze byla ${newStatus === 'hidden' ? 'skryta' : newStatus === 'removed' ? 'odstraněna' : 'aktivována'}`, 'success');
        await loadReviews();
        await loadStatistics();
      } catch (error) {
        console.error('Chyba při aktualizaci statusu:', error);
        showNotification('Nepodařilo se aktualizovat status recenze', 'error');
      }
    }

    // Notes modal
    function openNotesModal(reviewId, currentNotes, companyName) {
      currentReviewIdForNotes = reviewId;
      document.getElementById('adminNotesText').value = currentNotes;
      document.getElementById('notesModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeNotesModal() {
      document.getElementById('notesModal').classList.add('hidden');
      document.body.style.overflow = '';
      currentReviewIdForNotes = null;
    }

    document.getElementById('saveNotesBtn').addEventListener('click', async () => {
      const notes = document.getElementById('adminNotesText').value.trim();
      
      try {
        const { error } = await window.supabaseClient
          .from('reviews')
          .update({ admin_notes: notes })
          .eq('id', currentReviewIdForNotes);

        if (error) throw error;

        showNotification('Poznámky byly uloženy', 'success');
        closeNotesModal();
        await loadReviews();
      } catch (error) {
        console.error('Chyba při ukládání poznámek:', error);
        showNotification('Nepodařilo se uložit poznámky', 'error');
      }
    });

    // Switch tab
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      loadReviews();
    }

    // Notification
    function showNotification(message, type) {
      const colors = {
        success: 'bg-green-500',
        error: 'bg-red-500',
        info: 'bg-blue-500'
      };
      
      const notification = document.createElement('div');
      notification.className = `fixed top-4 right-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg z-[10000] animate-fade-in`;
      notification.textContent = message;
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.remove();
      }, 3000);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      const hasAccess = await checkAdminAccess();
      if (!hasAccess) return;

      await loadStatistics();
      await loadReviews();

      // Event listeners
      document.getElementById('reasonFilter').addEventListener('change', loadReviews);
      document.getElementById('sortBy').addEventListener('change', loadReviews);
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await window.supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });

      if (window.lucide) lucide.createIcons();
    });
  </script>

</body>
</html>
