<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartao Reels - Procházet tvůrce a firmy</title>
  <meta name="description" content="Procházej tvůrce a firmy ve fullscreen reels módu. Uklej si favority a kontaktuj tvůrce přímo.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Supabase Config -->
  <script src="supabase-config.js"></script>
  
  <style>
    body { 
      overflow: hidden;
      touch-action: pan-y;
      overscroll-behavior: none;
    }
    .snap-container {
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .snap-item {
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    .video-overlay {
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 20%, transparent 60%, rgba(0,0,0,0.8) 100%);
    }
    video {
      object-fit: cover;
    }
    .pulse-animation {
      animation: pulse 0.3s ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body class="bg-black text-white">

  <!-- REELS CONTAINER -->
  <div id="reelsContainer" class="snap-container h-screen w-screen overflow-y-scroll">
    <!-- Reels will be dynamically inserted here -->
  </div>

  <!-- POSITION INDICATOR -->
  <div id="positionIndicator" class="fixed top-20 right-4 z-30 px-3 py-1.5 rounded-full bg-black/40 backdrop-blur-sm border border-white/20 text-white text-xs font-semibold hidden">
    <span id="currentPosition">1</span> / <span id="totalReels">0</span>
  </div>

  <!-- SEARCH OVERLAY -->
  <div id="searchOverlay" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-50 hidden flex-col">
    <div class="p-4">
      <div class="flex items-center gap-3 mb-4">
        <button id="closeSearch" class="h-10 w-10 rounded-full bg-white/10 backdrop-blur-sm flex items-center justify-center hover:bg-white/20 transition">
          <i data-lucide="arrow-left" class="h-5 w-5"></i>
        </button>
        <div class="flex-1 relative">
          <i data-lucide="search" class="h-5 w-5 absolute left-4 top-1/2 -translate-y-1/2 text-white/60"></i>
          <input 
            id="searchInput" 
            type="text" 
            placeholder="Hledej tvůrce, téma, platformu..." 
            class="w-full rounded-full bg-white/10 border border-white/20 pl-12 pr-12 py-3 text-white placeholder-white/60 outline-none focus:border-white/40 focus:bg-white/15 transition"
            autocomplete="off"
          />
          <button id="clearSearch" class="absolute right-3 top-1/2 -translate-y-1/2 h-7 w-7 rounded-full bg-white/10 hover:bg-white/20 border border-white/10 transition grid place-items-center hidden">
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>
        </div>
      </div>

      <!-- Quick filters -->
      <div class="flex flex-wrap gap-2 mb-4">
        <button class="search-chip px-3 py-1.5 rounded-full bg-white/10 border border-white/20 text-white text-sm hover:bg-white/20 transition" data-filter="instagram">
          <i data-lucide="instagram" class="inline h-3.5 w-3.5 mr-1"></i>Instagram
        </button>
        <button class="search-chip px-3 py-1.5 rounded-full bg-white/10 border border-white/20 text-white text-sm hover:bg-white/20 transition" data-filter="tiktok">
          <i data-lucide="video" class="inline h-3.5 w-3.5 mr-1"></i>TikTok
        </button>
        <button class="search-chip px-3 py-1.5 rounded-full bg-white/10 border border-white/20 text-white text-sm hover:bg-white/20 transition" data-filter="youtube">
          <i data-lucide="youtube" class="inline h-3.5 w-3.5 mr-1"></i>YouTube
        </button>
        <button class="search-chip px-3 py-1.5 rounded-full bg-white/10 border border-white/20 text-white text-sm hover:bg-white/20 transition" data-filter="verified">
          <i data-lucide="check-circle" class="inline h-3.5 w-3.5 mr-1"></i>Ověřeno
        </button>
        <button class="search-chip px-3 py-1.5 rounded-full bg-white/10 border border-white/20 text-white text-sm hover:bg-white/20 transition" data-filter="premium">
          <i data-lucide="crown" class="inline h-3.5 w-3.5 mr-1"></i>VIP
        </button>
      </div>

      <!-- Search results -->
      <div id="searchResults" class="overflow-y-auto max-h-[calc(100vh-180px)]">
        <div class="text-white/60 text-sm text-center py-8">
          Začni psát pro vyhledávání...
        </div>
      </div>
    </div>
  </div>

  <!-- LOADING STATE -->
  <div id="loading" class="fixed inset-0 flex items-center justify-center bg-black z-50">
    <div class="flex flex-col items-center gap-4">
      <i data-lucide="loader-2" class="h-12 w-12 animate-spin text-white"></i>
      <p class="text-white/80">Načítám reels...</p>
    </div>
  </div>

  <script type="module">
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    // Get Supabase from config
    const supabase = window.supabaseClient;

    let allReels = [];
    let filteredReels = [];
    let currentIndex = 0;
    let savedCreators = new Set();
    let userId = null;
    let touchStartY = 0;
    let touchEndY = 0;
    let searchQuery = '';
    let activeFilters = [];

    // Demo data with video placeholders
    const demoReels = [
      {
        id: 1,
        handle: '@fitness_coach_martina',
        name: 'Martina Nováková',
        bio: '💪 Fitness trenérka | 🥗 Zdravá výživa',
        followers_count: 125000,
        verified: true,
        premium: true,
        avatar_url: null,
        video_url: 'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', // placeholder
        platforms: ['instagram', 'tiktok'],
        type: 'creator'
      },
      {
        id: 2,
        handle: '@tech_reviewer_jan',
        name: 'Jan Dvořák',
        bio: '📱 Tech reviews | 🎮 Gaming',
        followers_count: 89000,
        verified: true,
        premium: false,
        avatar_url: null,
        video_url: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
        platforms: ['youtube', 'instagram'],
        type: 'creator'
      },
      {
        id: 3,
        handle: '@beauty_by_petra',
        name: 'Petra Svobodová',
        bio: '💄 Beauty & Makeup | ✨ Lifestyle',
        followers_count: 210000,
        verified: true,
        premium: true,
        avatar_url: null,
        video_url: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
        platforms: ['instagram', 'tiktok', 'youtube'],
        type: 'creator'
      }
    ];

    // Check authentication
    async function checkAuth() {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        userId = user?.id;
        
        if (userId) {
          await loadSavedCreators();
        }
      } catch (error) {
        console.error('Auth check error:', error);
      }
    }

    // Load saved creators for current user
    async function loadSavedCreators() {
      if (!userId) return;
      
      try {
        const { data, error } = await supabase
          .from('saved_creators')
          .select('creator_id')
          .eq('user_id', userId);

        if (error) throw error;

        savedCreators = new Set(data.map(item => item.creator_id));
      } catch (error) {
        console.error('Error loading saved creators:', error);
      }
    }

    async function loadReels() {
      try {
        // Get URL parameters for filtering
        const params = new URLSearchParams(window.location.search);
        const platform = params.get('platform');
        const category = params.get('category');

        let query = supabase
          .from('creators')
          .select('*')
          .order('followers_count', { ascending: false })
          .limit(50);

        // Apply filters if provided
        if (platform) {
          query = query.contains('platforms', [platform]);
        }
        if (category) {
          query = query.contains('categories', [category]);
        }

        const { data, error } = await supabase
          .from('creators')
          .select('*')
          .order('followers_count', { ascending: false })
          .limit(50);

        if (error) throw error;

        if (data && data.length > 0) {
          // Map database data and add placeholder video URLs
          allReels = data.map((creator, index) => ({
            ...creator,
            video_url: creator.video_url || creator.showcase_video || demoReels[index % demoReels.length].video_url,
            isSaved: savedCreators.has(creator.id)
          }));
        } else {
          allReels = demoReels;
        }

        // Track analytics
        trackEvent('reels_loaded', { count: allReels.length });
      } catch (error) {
        console.error('Error loading reels:', error);
        allReels = demoReels;
      }

      renderReels();
      $('#loading').classList.add('hidden');
      
      // Update position indicator
      $('#totalReels').textContent = allReels.length;
      $('#positionIndicator').classList.remove('hidden');
      
      // Auto-play first video
      setTimeout(() => {
        const firstVideo = $('video');
        if (firstVideo) {
          firstVideo.play().catch(e => {
            console.log('Autoplay prevented:', e);
            // Show play button if autoplay is prevented
            $('#playIcon0')?.classList.remove('hidden');
          });
        }
      }, 100);
    }

    function renderReels() {
      const container = $('#reelsContainer');
      container.innerHTML = allReels.map((reel, index) => createReelHTML(reel, index)).join('');
      lucide.createIcons();

      // Attach video event listeners
      $$('video').forEach((video, index) => {
        video.addEventListener('ended', () => {
          video.currentTime = 0;
          video.play();
        });
      });

      // Attach scroll listener for video play/pause
      container.addEventListener('scroll', handleScroll);
    }

    function handleScroll() {
      const container = $('#reelsContainer');
      const scrollPosition = container.scrollTop;
      const screenHeight = window.innerHeight;
      const newIndex = Math.round(scrollPosition / screenHeight);

      if (newIndex !== currentIndex) {
        currentIndex = newIndex;
        
        // Update position indicator
        $('#currentPosition').textContent = currentIndex + 1;
        
        // Track view
        if (allReels[currentIndex]) {
          trackEvent('reel_viewed', { 
            creator_id: allReels[currentIndex].id,
            creator_name: allReels[currentIndex].name 
          });
        }
      }

      $$('video').forEach((video, index) => {
        if (index === currentIndex) {
          video.play().catch(e => console.log('Play prevented:', e));
        } else {
          video.pause();
        }
      });
    }

    function createReelHTML(reel, index) {
      const platformIcons = {
        instagram: 'instagram',
        tiktok: 'video',
        youtube: 'youtube',
        facebook: 'facebook',
        linkedin: 'linkedin'
      };

      const isSaved = savedCreators.has(reel.id);
      const badgeHtml = reel.premium 
        ? '<span class="px-2 py-1 rounded-full bg-gradient-to-r from-yellow-400 to-yellow-600 text-black text-xs font-bold flex items-center gap-1"><i data-lucide="crown" class="h-3 w-3"></i>VIP</span>'
        : reel.verified 
        ? '<span class="px-2 py-1 rounded-full bg-blue-500/20 border border-blue-400/50 text-blue-300 text-xs font-semibold flex items-center gap-1"><i data-lucide="check-circle" class="h-3 w-3"></i>Ověřeno</span>'
        : '';

      return `
        <div class="snap-item relative h-screen w-screen bg-black" data-reel-id="${reel.id}">
          <!-- Video Background -->
          <video 
            class="absolute inset-0 h-full w-full"
            src="${reel.video_url}"
            loop
            muted
            playsinline
            preload="metadata"
          ></video>

          <!-- Gradient Overlay -->
          <div class="video-overlay absolute inset-0 pointer-events-none"></div>

          <!-- Top Bar -->
          <div class="absolute top-0 left-0 right-0 p-4 flex items-center justify-between z-10">
            <button onclick="window.history.back()" class="h-10 w-10 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center hover:bg-black/60 transition">
              <i data-lucide="arrow-left" class="h-5 w-5"></i>
            </button>
            <div class="flex items-center gap-2">
              <button onclick="openSearchOverlay()" class="h-10 w-10 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center hover:bg-black/60 transition" title="Hledat">
                <i data-lucide="search" class="h-5 w-5"></i>
              </button>
              <button onclick="window.location.href='/kartao-marketplace.html#filters'" class="h-10 w-10 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center hover:bg-black/60 transition" title="Filtry">
                <i data-lucide="sliders" class="h-5 w-5"></i>
              </button>
            </div>
          </div>

          <!-- Bottom Info -->
          <div class="absolute bottom-0 left-0 right-0 p-6 pb-8 z-10">
            <div class="flex gap-4">
              <!-- Left: Info -->
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-2">
                  <h3 class="text-lg font-bold truncate">${reel.name}</h3>
                  ${badgeHtml}
                </div>
                
                <p class="text-sm text-white/90 mb-2">${reel.handle}</p>
                
                <p class="text-sm text-white/80 line-clamp-2 mb-3">${reel.bio || ''}</p>

                <div class="flex items-center gap-3 text-sm text-white/70">
                  <span class="flex items-center gap-1">
                    <i data-lucide="users" class="h-4 w-4"></i>
                    ${formatNumber(reel.followers_count)}
                  </span>
                  <div class="flex gap-2">
                    ${(reel.platforms || []).map(p => `
                      <i data-lucide="${platformIcons[p] || 'circle'}" class="h-4 w-4"></i>
                    `).join('')}
                  </div>
                </div>

                <div class="flex gap-2 mt-4">
                  <button onclick="viewProfile('${reel.id}')" class="flex-1 px-4 py-2.5 rounded-full bg-white text-black font-semibold text-sm hover:bg-white/90 transition flex items-center justify-center gap-2">
                    <i data-lucide="user" class="h-4 w-4"></i>
                    Profil
                  </button>
                  <button onclick="contactCreator('${reel.id}')" class="flex-1 px-4 py-2.5 rounded-full bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white font-semibold text-sm hover:brightness-110 transition flex items-center justify-center gap-2">
                    <i data-lucide="send" class="h-4 w-4"></i>
                    Poptat
                  </button>
                </div>
              </div>

              <!-- Right: Actions -->
              <div class="flex flex-col items-center gap-6">
                <button id="saveBtn${index}" onclick="toggleSave('${reel.id}', ${index})" class="flex flex-col items-center gap-1 hover:scale-110 transition">
                  <div class="h-12 w-12 rounded-full ${isSaved ? 'bg-red-500/20' : 'bg-white/10'} backdrop-blur-sm border ${isSaved ? 'border-red-500/50' : 'border-white/20'} flex items-center justify-center">
                    <i data-lucide="${isSaved ? 'heart' : 'heart'}" class="h-6 w-6 ${isSaved ? 'fill-red-500 text-red-500' : ''}"></i>
                  </div>
                  <span class="text-xs text-white/80">${isSaved ? 'Uloženo' : 'Uložit'}</span>
                </button>

                <button onclick="shareCreator('${reel.id}')" class="flex flex-col items-center gap-1 hover:scale-110 transition">
                  <div class="h-12 w-12 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 flex items-center justify-center">
                    <i data-lucide="share-2" class="h-6 w-6"></i>
                  </div>
                  <span class="text-xs text-white/80">Sdílet</span>
                </button>

                <button onclick="showMoreOptions('${reel.id}')" class="flex flex-col items-center gap-1 hover:scale-110 transition">
                  <div class="h-12 w-12 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 flex items-center justify-center">
                    <i data-lucide="more-horizontal" class="h-6 w-6"></i>
                  </div>
                  <span class="text-xs text-white/80">Více</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Tap to play/pause overlay -->
          <div class="absolute inset-0 flex items-center justify-center z-0" onclick="toggleVideoPlay(event, ${index})">
            <div id="playIcon${index}" class="hidden">
              <div class="h-20 w-20 rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center">
                <i data-lucide="play" class="h-10 w-10"></i>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }

    window.toggleVideoPlay = function(event, index) {
      const video = $$('video')[index];
      const playIcon = $(`#playIcon${index}`);
      
      if (video.paused) {
        video.play();
        playIcon.classList.add('hidden');
      } else {
        video.pause();
        playIcon.classList.remove('hidden');
        setTimeout(() => playIcon.classList.add('hidden'), 500);
      }
    };

    // Save/unsave creator
    window.toggleSave = async function(creatorId, index) {
      if (!userId) {
        // Redirect to login
        window.location.href = '/prihlasit-se.html?redirect=' + encodeURIComponent(window.location.pathname);
        return;
      }

      const isSaved = savedCreators.has(creatorId);
      const saveBtn = $(`#saveBtn${index}`);
      
      try {
        if (isSaved) {
          // Unsave
          const { error } = await supabase
            .from('saved_creators')
            .delete()
            .eq('user_id', userId)
            .eq('creator_id', creatorId);

          if (error) throw error;

          savedCreators.delete(creatorId);
          showToast('Odebráno z uložených');
          trackEvent('creator_unsaved', { creator_id: creatorId });
        } else {
          // Save
          const { error } = await supabase
            .from('saved_creators')
            .insert({
              user_id: userId,
              creator_id: creatorId,
              created_at: new Date().toISOString()
            });

          if (error) throw error;

          savedCreators.add(creatorId);
          showToast('Uloženo do favoritů ❤️');
          trackEvent('creator_saved', { creator_id: creatorId });
        }

        // Update button appearance
        const heartIcon = saveBtn.querySelector('i');
        const btnText = saveBtn.querySelector('span');
        const btnContainer = saveBtn.querySelector('div');
        
        if (savedCreators.has(creatorId)) {
          btnContainer.className = 'h-12 w-12 rounded-full bg-red-500/20 backdrop-blur-sm border border-red-500/50 flex items-center justify-center pulse-animation';
          heartIcon.className = 'h-6 w-6 fill-red-500 text-red-500';
          btnText.textContent = 'Uloženo';
        } else {
          btnContainer.className = 'h-12 w-12 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 flex items-center justify-center';
          heartIcon.className = 'h-6 w-6';
          btnText.textContent = 'Uložit';
        }

        lucide.createIcons();
      } catch (error) {
        console.error('Error toggling save:', error);
        showToast('Chyba při ukládání', 'error');
      }
    };

    // View creator profile
    window.viewProfile = function(creatorId) {
      trackEvent('profile_viewed_from_reels', { creator_id: creatorId });
      window.location.href = `/creator-profile.html?id=${creatorId}`;
    };

    // Contact creator
    window.contactCreator = function(creatorId) {
      if (!userId) {
        window.location.href = '/prihlasit-se.html?redirect=' + encodeURIComponent(`/zadat-kampan.html?creator=${creatorId}`);
        return;
      }
      trackEvent('contact_from_reels', { creator_id: creatorId });
      window.location.href = `/zadat-kampan.html?creator=${creatorId}`;
    };

    // Share creator
    window.shareCreator = async function(creatorId) {
      const reel = allReels.find(r => r.id === creatorId);
      if (!reel) return;

      const shareData = {
        title: `${reel.name} na Kartao.cz`,
        text: `Podívej se na profil ${reel.name} - ${reel.bio}`,
        url: `${window.location.origin}/creator-profile.html?id=${creatorId}`
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
          trackEvent('creator_shared', { creator_id: creatorId, method: 'native' });
        } else {
          // Fallback - copy to clipboard
          await navigator.clipboard.writeText(shareData.url);
          showToast('Link zkopírován do schránky');
          trackEvent('creator_shared', { creator_id: creatorId, method: 'clipboard' });
        }
      } catch (error) {
        console.error('Error sharing:', error);
      }
    };

    // Show more options
    window.showMoreOptions = function(creatorId) {
      // TODO: Implement options modal
      showToast('Další možnosti - zatím nedostupné');
    };

    // Toast notification
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `fixed top-20 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full ${
        type === 'error' ? 'bg-red-500' : 'bg-white/10'
      } backdrop-blur-xl border border-white/20 text-white font-semibold shadow-xl`;
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.transition = 'opacity 0.3s';
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }

    // Analytics tracking
    function trackEvent(eventName, properties = {}) {
      try {
        // Log to console for now
        console.log('Track event:', eventName, properties);
        
        // TODO: Implement real analytics (Google Analytics, Mixpanel, etc.)
        if (window.gtag) {
          window.gtag('event', eventName, properties);
        }
      } catch (error) {
        console.error('Analytics error:', error);
      }
    }

    // Touch gestures for better mobile experience
    function setupTouchGestures() {
      const container = $('#reelsContainer');
      
      container.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndY = e.changedTouches[0].clientY;
        handleSwipe();
      }, { passive: true });
    }

    function handleSwipe() {
      const swipeThreshold = 50;
      const diff = touchStartY - touchEndY;

      if (Math.abs(diff) > swipeThreshold) {
        if (diff > 0) {
          // Swipe up - next reel
          trackEvent('swipe_up', { from_index: currentIndex });
        } else {
          // Swipe down - previous reel
          trackEvent('swipe_down', { from_index: currentIndex });
        }
      }
    }

    // Keyboard navigation
    function setupKeyboardNavigation() {
      document.addEventListener('keydown', (e) => {
        const container = $('#reelsContainer');
        const screenHeight = window.innerHeight;

        switch(e.key) {
          case 'ArrowUp':
            e.preventDefault();
            container.scrollBy({ top: -screenHeight, behavior: 'smooth' });
            break;
          case 'ArrowDown':
            e.preventDefault();
            container.scrollBy({ top: screenHeight, behavior: 'smooth' });
            break;
          case ' ':
            e.preventDefault();
            toggleVideoPlay(null, currentIndex);
            break;
          case 'Escape':
            window.history.back();
            break;
        }
      });
    }

    // Search functionality
    window.openSearchOverlay = function() {
      $('#searchOverlay').classList.remove('hidden');
      $('#searchOverlay').classList.add('flex');
      setTimeout(() => {
        $('#searchInput').focus();
        lucide.createIcons();
      }, 100);
      trackEvent('search_opened');
    };

    function closeSearchOverlay() {
      $('#searchOverlay').classList.add('hidden');
      $('#searchOverlay').classList.remove('flex');
      trackEvent('search_closed');
    }

    function performSearch(query, filters = []) {
      searchQuery = query.toLowerCase().trim();
      activeFilters = filters;

      if (!searchQuery && activeFilters.length === 0) {
        $('#searchResults').innerHTML = `
          <div class="text-white/60 text-sm text-center py-8">
            Začni psát pro vyhledávání...
          </div>
        `;
        return;
      }

      // Filter reels based on search query and filters
      filteredReels = allReels.filter(reel => {
        const matchesQuery = !searchQuery || 
          reel.name?.toLowerCase().includes(searchQuery) ||
          reel.handle?.toLowerCase().includes(searchQuery) ||
          reel.bio?.toLowerCase().includes(searchQuery) ||
          (reel.categories || []).some(cat => cat.toLowerCase().includes(searchQuery)) ||
          (reel.platforms || []).some(p => p.toLowerCase().includes(searchQuery));

        const matchesFilters = activeFilters.length === 0 || activeFilters.every(filter => {
          switch(filter) {
            case 'instagram':
            case 'tiktok':
            case 'youtube':
            case 'facebook':
              return (reel.platforms || []).includes(filter);
            case 'verified':
              return reel.verified === true;
            case 'premium':
              return reel.premium === true;
            default:
              return true;
          }
        });

        return matchesQuery && matchesFilters;
      });

      displaySearchResults(filteredReels);
      trackEvent('search_performed', { query: searchQuery, results: filteredReels.length });
    }

    function displaySearchResults(results) {
      const resultsContainer = $('#searchResults');
      
      if (results.length === 0) {
        resultsContainer.innerHTML = `
          <div class="text-white/60 text-sm text-center py-8">
            <i data-lucide="search-x" class="h-12 w-12 mx-auto mb-3 opacity-50"></i>
            <p>Žádné výsledky</p>
            <p class="text-xs mt-2">Zkus jiný výraz nebo filtry</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      resultsContainer.innerHTML = `
        <div class="text-white/80 text-sm mb-3 px-1">
          Nalezeno <span class="font-bold">${results.length}</span> tvůrců
        </div>
        <div class="grid gap-3">
          ${results.map((reel, index) => `
            <button onclick="jumpToReel('${reel.id}')" class="flex items-center gap-3 p-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 transition text-left">
              <div class="h-14 w-14 rounded-full bg-gradient-to-br from-fuchsia-500/30 to-purple-500/30 flex items-center justify-center text-xl font-bold flex-shrink-0">
                ${reel.name?.charAt(0) || '?'}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <span class="font-semibold truncate">${reel.name}</span>
                  ${reel.premium ? '<i data-lucide="crown" class="h-3.5 w-3.5 text-yellow-400 flex-shrink-0"></i>' : ''}
                  ${reel.verified ? '<i data-lucide="check-circle" class="h-3.5 w-3.5 text-blue-400 flex-shrink-0"></i>' : ''}
                </div>
                <div class="text-xs text-white/60 truncate">${reel.handle || ''}</div>
                <div class="flex items-center gap-2 mt-1 text-xs text-white/50">
                  <span class="flex items-center gap-1">
                    <i data-lucide="users" class="h-3 w-3"></i>
                    ${formatNumber(reel.followers_count)}
                  </span>
                  ${(reel.platforms || []).slice(0, 3).map(p => {
                    const icons = { instagram: 'instagram', tiktok: 'video', youtube: 'youtube', facebook: 'facebook' };
                    return `<i data-lucide="${icons[p] || 'circle'}" class="h-3 w-3"></i>`;
                  }).join('')}
                </div>
              </div>
              <i data-lucide="chevron-right" class="h-5 w-5 text-white/40 flex-shrink-0"></i>
            </button>
          `).join('')}
        </div>
      `;
      
      lucide.createIcons();
    }

    window.jumpToReel = function(reelId) {
      const reelIndex = allReels.findIndex(r => r.id === reelId);
      if (reelIndex === -1) return;

      const container = $('#reelsContainer');
      const screenHeight = window.innerHeight;
      
      closeSearchOverlay();
      
      setTimeout(() => {
        container.scrollTo({
          top: reelIndex * screenHeight,
          behavior: 'smooth'
        });
        
        trackEvent('jump_to_reel', { reel_id: reelId, from_search: true });
      }, 300);
    };

    // Setup search event listeners
    function setupSearchListeners() {
      const searchInput = $('#searchInput');
      const clearBtn = $('#clearSearch');
      const closeBtn = $('#closeSearch');
      
      // Search input
      let searchTimeout;
      searchInput.addEventListener('input', (e) => {
        const value = e.target.value;
        
        // Show/hide clear button
        if (value) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }
        
        // Debounce search
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          performSearch(value, activeFilters);
        }, 300);
      });

      // Clear button
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.classList.add('hidden');
        performSearch('', activeFilters);
        searchInput.focus();
      });

      // Close button
      closeBtn.addEventListener('click', closeSearchOverlay);

      // Quick filter chips
      $$('.search-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const filter = chip.dataset.filter;
          
          if (activeFilters.includes(filter)) {
            activeFilters = activeFilters.filter(f => f !== filter);
            chip.classList.remove('bg-fuchsia-500/30', 'border-fuchsia-500/50');
            chip.classList.add('bg-white/10', 'border-white/20');
          } else {
            activeFilters.push(filter);
            chip.classList.add('bg-fuchsia-500/30', 'border-fuchsia-500/50');
            chip.classList.remove('bg-white/10', 'border-white/20');
          }
          
          performSearch(searchInput.value, activeFilters);
          lucide.createIcons();
        });
      });

      // ESC to close
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !$('#searchOverlay').classList.contains('hidden')) {
          closeSearchOverlay();
        }
      });
    }

    // Init
    async function init() {
      await checkAuth();
      await loadReels();
      setupTouchGestures();
      setupKeyboardNavigation();
      setupSearchListeners();
      
      // Track session
      trackEvent('reels_session_started');
    }

    init();
  </script>
</body>
</html>
