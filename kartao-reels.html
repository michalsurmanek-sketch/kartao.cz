<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartao Reels - Procházet tvůrce a firmy</title>
  <meta name="description" content="Procházej tvůrce a firmy ve fullscreen reels módu. Uklej si favority a kontaktuj tvůrce přímo.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Supabase Config -->
  <script src="supabase-config.js"></script>
  
  <style>
    body { 
      overflow: hidden;
      touch-action: pan-y;
      overscroll-behavior: none;
    }
    .snap-container {
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .snap-item {
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    .video-overlay {
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 20%, transparent 60%, rgba(0,0,0,0.8) 100%);
    }
    video {
      object-fit: cover;
    }
    .pulse-animation {
      animation: pulse 0.3s ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    
    /* Flying heart animation */
    .flying-heart {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      font-size: 60px;
      animation: flyToButton 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    
    @keyframes flyToButton {
      0% {
        transform: translate(-50%, -50%) scale(0) rotate(0deg);
        opacity: 0;
      }
      15% {
        transform: translate(-50%, -50%) scale(1.5) rotate(15deg);
        opacity: 1;
      }
      50% {
        transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(180deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0.8) rotate(360deg);
        opacity: 0;
      }
    }
    
    .heart-burst {
      animation: heartBurst 0.5s ease-out forwards;
    }
    
    @keyframes heartBurst {
      0% {
        transform: scale(0.8);
        filter: brightness(1);
      }
      50% {
        transform: scale(1.4);
        filter: brightness(1.5) drop-shadow(0 0 20px rgba(239, 68, 68, 0.8));
      }
      100% {
        transform: scale(1);
        filter: brightness(1);
      }
    }
    
    .fade-out-text {
      animation: fadeOut 0.4s ease-out forwards;
    }
    
    @keyframes fadeOut {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-10px);
      }
    }

    /* Filter Styles */
    .seg-reels {
      padding: 0.625rem 1rem;
      border-radius: 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.15s;
      font-size: 0.875rem;
    }
    .seg-reels:hover {
      background: rgba(255,255,255,0.1);
    }
    .seg-reels.active {
      background: rgba(255,255,255,0.15);
      border-color: rgb(217, 70, 239);
      font-weight: 600;
      box-shadow: 0 0 0 1px rgb(217, 70, 239);
    }

    .pill-reels {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1rem;
      border-radius: 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.15s;
      font-size: 0.875rem;
    }
    .pill-reels:hover {
      background: rgba(255,255,255,0.1);
    }
    .pill-reels.active {
      background: rgba(255,255,255,0.15);
      border-color: rgb(217, 70, 239);
      font-weight: 600;
      box-shadow: 0 0 0 1px rgb(217, 70, 239);
    }

    .tagBtn-reels {
      padding: 0.5rem 0.875rem;
      border-radius: 9999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.15s;
      font-size: 0.8125rem;
    }
    .tagBtn-reels:hover {
      background: rgba(255,255,255,0.1);
    }
    .tagBtn-reels.active {
      background: rgba(255,255,255,0.15);
      border-color: rgb(217, 70, 239);
      font-weight: 600;
      box-shadow: 0 0 0 1px rgb(217, 70, 239);
    }

    /* Right side panel styles */
    .action-button {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .action-button:active {
      transform: scale(0.9);
    }
    
    .action-count {
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body class="bg-black text-white">

  <!-- REELS CONTAINER -->
  <div id="reelsContainer" class="snap-container h-screen w-screen overflow-y-scroll">
    <!-- Reels will be dynamically inserted here -->
  </div>

  <!-- PROFILE CARD MODAL -->
  <div id="profileModal" class="fixed inset-0 z-[100] hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeProfileModal()"></div>
    
    <!-- Card -->
    <div class="absolute inset-x-4 top-1/2 -translate-y-1/2 max-w-lg mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] overflow-y-auto">
      <!-- Close button -->
      <button onclick="closeProfileModal()" class="absolute top-4 right-4 z-10 h-10 w-10 rounded-full bg-black/10 hover:bg-black/20 flex items-center justify-center transition">

      </button>

      <!-- Content will be dynamically inserted -->
      <div id="profileModalContent"></div>

  <!-- FILTERS MODAL -->
  <div id="filtersModal" class="fixed inset-0 z-[100] hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeFiltersModal()"></div>
    
    <!-- Filters Panel -->
    <div class="absolute inset-x-4 top-1/2 -translate-y-1/2 max-w-lg mx-auto rounded-3xl border border-white/10 bg-white/[0.15] backdrop-blur-sm p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between gap-3 mb-5">
        <div class="flex items-center gap-3">
          <button onclick="closeFiltersModal()" class="inline-flex items-center justify-center h-8 w-8 rounded-lg bg-white/10 hover:bg-white/20 border border-white/10 transition">
            <i data-lucide="x" class="h-5 w-5"></i>
          </button>
          <div>
            <div class="text-sm text-white/60">Pokročilé</div>
            <h2 class="text-xl font-extrabold">Filtry</h2>
          </div>
        </div>
        <button id="resetReels" class="inline-flex items-center gap-2 px-3 py-2 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition text-sm">
          <i data-lucide="rotate-ccw" class="h-4 w-4"></i>
          Reset
        </button>
      </div>

      <div class="grid gap-4">
        <div class="grid gap-2">
          <div class="text-sm text-white/70">Typ profilu</div>
          <div class="grid grid-cols-2 gap-2">
            <button class="seg-reels active" data-seg="creator">Tvůrci</button>
            <button class="seg-reels" data-seg="brand">Firmy</button>
          </div>
        </div>

        <div class="grid gap-2">
          <div class="text-sm text-white/70">Platformy</div>
          <div class="grid grid-cols-2 gap-2">
            <button class="pill-reels" data-plat="instagram"><i data-lucide="instagram" class="h-4 w-4"></i><span>Instagram</span></button>
            <button class="pill-reels" data-plat="tiktok"><i data-lucide="video" class="h-4 w-4"></i><span>TikTok</span></button>
            <button class="pill-reels" data-plat="youtube"><i data-lucide="youtube" class="h-4 w-4"></i><span>YouTube</span></button>
            <button class="pill-reels" data-plat="facebook"><i data-lucide="facebook" class="h-4 w-4"></i><span>Facebook</span></button>
          </div>
        </div>

        <div class="grid gap-2">
          <div class="flex items-center justify-between">
            <div class="text-sm text-white/70">Téma</div>
            <div class="text-xs text-white/50">(multi)</div>
          </div>
          <div class="flex flex-wrap gap-2">
            <button class="tagBtn-reels" data-topic="fitness">Fitness</button>
            <button class="tagBtn-reels" data-topic="beauty">Beauty</button>
            <button class="tagBtn-reels" data-topic="auta">Auta</button>
            <button class="tagBtn-reels" data-topic="gaming">Gaming</button>
            <button class="tagBtn-reels" data-topic="travel">Cestování</button>
            <button class="tagBtn-reels" data-topic="food">Jídlo</button>
          </div>
        </div>

        <div class="grid gap-2">
          <div class="text-sm text-white/70">Region</div>
          <select id="regionReels" class="w-full rounded-2xl bg-neutral-950/50 border border-white/10 px-4 py-3 outline-none focus:border-white/25">
            <option value="all">Vše</option>
            <option value="cz">ČR</option>
            <option value="sk">SK</option>
            <option value="eu">EU</option>
          </select>
        </div>

        <div class="grid gap-2">
          <div class="text-sm text-white/70">Min. followers</div>
          <input id="followersReels" type="range" min="0" max="500000" step="10000" value="0" class="w-full" />
          <div class="flex items-center justify-between text-xs text-white/60">
            <span>0</span>
            <span id="followersValReels" class="text-white/80 font-semibold">0</span>
            <span>500k+</span>
          </div>
        </div>

        <div class="rounded-3xl border border-white/10 bg-neutral-950/35 p-5">
          <div class="flex items-start gap-3">
            <div class="h-11 w-11 rounded-2xl bg-white/5 border border-white/10 grid place-items-center">
              <i data-lucide="shield-check" class="h-5 w-5"></i>
            </div>
            <div>
              <div class="font-bold">Ověřené karty</div>
              <div class="text-sm text-white/60 mt-1">Chceš jen profily s ověřenými daty?</div>
              <label class="mt-3 inline-flex items-center gap-2 text-sm text-white/70">
                <input id="verifiedReels" type="checkbox" class="h-4 w-4" />
                Jen ověřené
              </label>
            </div>
          </div>
        </div>

        <button onclick="applyFiltersReels()" class="w-full px-6 py-3 rounded-full bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white font-semibold hover:brightness-110 transition">
          Použít filtry
        </button>
      </div>
    </div>
  </div>

  <!-- LOADING STATE -->
  <div id="loading" class="fixed inset-0 flex items-center justify-center bg-black z-50">
    <div class="flex flex-col items-center gap-4">
      <i data-lucide="loader-2" class="h-12 w-12 animate-spin text-white"></i>
      <p class="text-white/80">Načítám reels...</p>
    </div>
  </div>

  <script type="module">
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    // Initialize Supabase
    const SUPABASE_URL = 'https://hrmrgudiindtnfaaiyyg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhybXJndWRpaW5kdG5mYWFpeXlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2MDQ2MzgsImV4cCI6MjA4MDE4MDYzOH0.J83cwvvUanIh4flrogiMfF8g1tOJUu2xW2dG-TfAhm0';
    
    // Check if Supabase is loaded before initializing
    let supabase = null;
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('✅ Supabase klient inicializován');
    } else {
      console.warn('⚠️ Supabase není dostupný, použijí se demo data');
    }

    let allReels = [];
    let filteredReels = [];
    let currentIndex = 0;
    let savedCreators = new Set();
    let userId = null;
    let touchStartY = 0;
    let touchEndY = 0;
    let searchQuery = '';
    let activeFilters = [];

    // Demo data with video placeholders
    const demoReels = [
      {
        id: 1,
        handle: '@fitness_coach_martina',
        name: 'Martina Nováková',
        bio: '💪 Fitness trenérka | 🥗 Zdravá výživa',
        followers_count: 125000,
        verified: true,
        premium: true,
        avatar_url: null,
        video_url: 'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', // placeholder
        platforms: ['instagram', 'tiktok'],
        type: 'creator'
      },
      {
        id: 2,
        handle: '@tech_reviewer_jan',
        name: 'Jan Dvořák',
        bio: '📱 Tech reviews | 🎮 Gaming',
        followers_count: 89000,
        verified: true,
        premium: false,
        avatar_url: null,
        video_url: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
        platforms: ['youtube', 'instagram'],
        type: 'creator'
      },
      {
        id: 3,
        handle: '@beauty_by_petra',
        name: 'Petra Svobodová',
        bio: '💄 Beauty & Makeup | ✨ Lifestyle',
        followers_count: 210000,
        verified: true,
        premium: true,
        avatar_url: null,
        video_url: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
        platforms: ['instagram', 'tiktok', 'youtube'],
        type: 'creator'
      }
    ];

    // Check authentication and setup listener
    async function checkAuth() {
      // Skip auth check if Supabase is not available
      if (!supabase) {
        console.log('Přeskakuji kontrolu autentizace (Supabase není k dispozici)');
        return;
      }
      
      try {
        // Check current session
        const { data: { session } } = await supabase.auth.getSession();
        
        if (session?.user) {
          userId = session.user.id;
          await loadSavedCreators();
          console.log('✅ User authenticated:', userId);
        } else {
          console.log('❌ No user session found');
        }

        // Listen for auth changes
        supabase.auth.onAuthStateChange(async (event, session) => {
          console.log('Auth state changed:', event, session?.user?.id);
          
          if (session?.user) {
            userId = session.user.id;
            await loadSavedCreators();
          } else {
            userId = null;
            savedCreators.clear();
          }
        });
      } catch (error) {
        console.error('❌ Auth check error:', error);
      }
    }

    // Load saved creators for current user
    async function loadSavedCreators() {
      if (!supabase) {
        console.log('⚠️ Cannot load saved creators - Supabase not available');
        return;
      }
      
      if (!userId) {
        console.log('⚠️ Cannot load saved creators - no userId');
        return;
      }
      
      try {
        const { data, error } = await supabase
          .from('saved_creators')
          .select('creator_id')
          .eq('user_id', userId);

        if (error) throw error;

        savedCreators = new Set(data.map(item => item.creator_id));
        console.log('✅ Loaded saved creators:', savedCreators.size);
        
        // Update UI for all reels
        updateAllSaveButtons();
      } catch (error) {
        console.error('❌ Error loading saved creators:', error);
      }
    }

    // Update all save buttons based on current saved state
    function updateAllSaveButtons() {
      allReels.forEach((reel, index) => {
        const saveBtn = $(`#saveBtn${index}`);
        if (!saveBtn) return;

        const isSaved = savedCreators.has(reel.id);
        const heartIcon = saveBtn.querySelector('i');
        const btnText = saveBtn.querySelector('span');
        const btnContainer = saveBtn.querySelector('div');

        if (isSaved) {
          btnContainer.className = 'h-10 w-10 rounded-full bg-red-500/20 backdrop-blur-sm border border-red-500/50 flex items-center justify-center hover:scale-110 transition-transform';
          if (heartIcon) {
            heartIcon.className = 'h-5 w-5 fill-red-500 text-red-500';
          }
          // Keep likes count unchanged
        } else {
          btnContainer.className = 'h-10 w-10 rounded-full bg-black/40 backdrop-blur-sm border border-white/20 flex items-center justify-center hover:scale-110 transition-transform';
          if (heartIcon) {
            heartIcon.className = 'h-5 w-5 text-white';
          }
          // Keep likes count unchanged
        }
      });
      
      lucide.createIcons();
    }

    async function loadReels() {
      try {
        // If Supabase is not available, use demo data
        if (!supabase) {
          console.log('Používám demo data (Supabase není k dispozici)');
          allReels = demoReels;
          renderReels();
          $('#loading').classList.add('hidden');
          return;
        }

        // Get URL parameters for filtering
        const params = new URLSearchParams(window.location.search);
        const platform = params.get('platform');
        const category = params.get('category');

        let query = supabase
          .from('creators')
          .select('*')
          .order('followers_count', { ascending: false })
          .limit(50);

        // Apply filters if provided
        if (platform) {
          query = query.contains('platforms', [platform]);
        }
        if (category) {
          query = query.contains('categories', [category]);
        }

        // Execute the query with filters applied
        const { data, error } = await query;

        if (error) throw error;

        if (data && data.length > 0) {
          // Map database data and add placeholder video URLs
          allReels = data.map((creator, index) => ({
            ...creator,
            video_url: creator.video_url || creator.showcase_video || demoReels[index % demoReels.length].video_url,
            isSaved: savedCreators.has(creator.id)
          }));
        } else {
          console.log('Žádná data z databáze, používám demo data');
          allReels = demoReels;
        }

        // Track analytics
        trackEvent('reels_loaded', { count: allReels.length });
      } catch (error) {
        console.error('Chyba při načítání reels:', error);
        allReels = demoReels;
      }

      renderReels();
      $('#loading').classList.add('hidden');
      
      // Auto-play first video
      setTimeout(() => {
        const firstVideo = $('video');
        if (firstVideo) {
          firstVideo.play().catch(e => {
            console.log('Autoplay prevented:', e);
            // Show play button if autoplay is prevented
            $('#playIcon0')?.classList.remove('hidden');
          });
        }
      }, 100);
    }

    function renderReels() {
      const container = $('#reelsContainer');
      container.innerHTML = allReels.map((reel, index) => createReelHTML(reel, index)).join('');
      lucide.createIcons();

      // Attach video event listeners
      $$('video').forEach((video, index) => {
        video.addEventListener('ended', () => {
          video.currentTime = 0;
          video.play();
        });
      });

      // Attach scroll listener for video play/pause
      container.addEventListener('scroll', handleScroll);
    }

    function handleScroll() {
      const container = $('#reelsContainer');
      const scrollPosition = container.scrollTop;
      const screenHeight = window.innerHeight;
      const newIndex = Math.round(scrollPosition / screenHeight);

      if (newIndex !== currentIndex) {
        currentIndex = newIndex;
        
        // Track view
        if (allReels[currentIndex]) {
          trackEvent('reel_viewed', { 
            creator_id: allReels[currentIndex].id,
            creator_name: allReels[currentIndex].name 
          });
        }
      }

      $$('video').forEach((video, index) => {
        if (index === currentIndex) {
          video.play().catch(e => console.log('Play prevented:', e));
        } else {
          video.pause();
        }
      });
    }

    function createReelHTML(reel, index) {
      const platformIcons = {
        instagram: 'instagram',
        tiktok: 'video',
        youtube: 'youtube',
        facebook: 'facebook',
        linkedin: 'linkedin'
      };

      const isSaved = savedCreators.has(reel.id);
      const badgeHtml = reel.premium 
        ? '<span class="px-2 py-1 rounded-full bg-gradient-to-r from-yellow-400 to-yellow-600 text-black text-xs font-bold flex items-center gap-1"><i data-lucide="crown" class="h-3 w-3"></i>VIP</span>'
        : reel.verified 
        ? '<span class="px-2 py-1 rounded-full bg-blue-500/20 border border-blue-400/50 text-blue-300 text-xs font-semibold flex items-center gap-1"><i data-lucide="check-circle" class="h-3 w-3"></i>Ověřeno</span>'
        : '';

      return `
        <div class="snap-item relative h-screen w-screen bg-black" data-reel-id="${reel.id}">
          <!-- Video Background -->
          <video 
            class="absolute inset-0 h-full w-full"
            src="${reel.video_url}"
            loop
            muted
            playsinline
            preload="metadata"
          ></video>

          <!-- Gradient Overlay -->
          <div class="video-overlay absolute inset-0 pointer-events-none"></div>

          <!-- Top Bar -->
          <div class="absolute top-0 left-0 right-0 p-4 flex items-center justify-between z-10">
            <button onclick="window.history.back()" class="h-10 w-10 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center hover:bg-black/60 transition">
              <i data-lucide="arrow-left" class="h-5 w-5"></i>
            </button>
            <div class="flex items-center gap-2">
              <!-- Search bar that expands from icon -->
              <div id="searchBarInline${index}" class="flex items-center gap-2 bg-black/30 backdrop-blur-md rounded-full transition-all duration-300 ease-out overflow-hidden border border-white/10" style="width: 40px;">
                <button id="searchIconBtn${index}" onclick="openSearchOverlay(${index})" class="h-10 w-10 rounded-full flex items-center justify-center hover:bg-black/40 transition flex-shrink-0" title="Hledat">
                  <i data-lucide="search" class="h-5 w-5"></i>
                </button>
                <div id="searchInputWrapper${index}" class="flex-1 opacity-0 transition-opacity duration-200" style="width: 0;">
                  <input 
                    id="searchInputInline${index}" 
                    type="text" 
                    placeholder="Hledej tvůrce..." 
                    class="w-full bg-transparent py-2 pr-3 text-white placeholder-white/50 outline-none text-sm"
                    autocomplete="off"
                    oninput="handleSearchInput(${index}, this.value)"
                  />
                </div>
                <button id="closeSearchInline${index}" onclick="closeSearchOverlay(${index})" class="h-10 w-10 rounded-full flex items-center justify-center hover:bg-white/10 transition flex-shrink-0 opacity-0" style="width: 0;">
                  <i data-lucide="x" class="h-5 w-5"></i>
                </button>
              </div>
              <button onclick="openFiltersModal()" class="h-10 w-10 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center hover:bg-black/60 transition relative" title="Filtry">
                <i data-lucide="sliders" class="h-5 w-5"></i>
                <span id="filtersBadge" class="hidden absolute -top-1 -right-1 h-4 w-4 rounded-full bg-fuchsia-500 border-2 border-black"></span>
              </button>
            </div>

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }

    window.toggleVideoPlay = function(event, index) {
      const video = $$('video')[index];
      const playIcon = $(`#playIcon${index}`);
      
      if (video.paused) {
        video.play();
        playIcon.classList.add('hidden');
      } else {
        video.pause();
        playIcon.classList.remove('hidden');
        setTimeout(() => playIcon.classList.add('hidden'), 500);
      }
    };

    // Save/unsave creator
    // Flying heart effect
    function createFlyingHeart(targetButton) {
      const heart = document.createElement('div');
      heart.className = 'flying-heart';
      heart.innerHTML = '❤️';
      
      // Start position (center of screen)
      const startX = window.innerWidth / 2;
      const startY = window.innerHeight / 2;
      
      // Target position (save button)
      const btnRect = targetButton.getBoundingClientRect();
      const targetX = btnRect.left + btnRect.width / 2;
      const targetY = btnRect.top + btnRect.height / 2;
      
      // Calculate translation
      const tx = targetX - startX;
      const ty = targetY - startY;
      
      heart.style.left = startX + 'px';
      heart.style.top = startY + 'px';
      heart.style.setProperty('--tx', `${tx}px`);
      heart.style.setProperty('--ty', `${ty}px`);
      
      document.body.appendChild(heart);
      
      // Remove after animation
      setTimeout(() => {
        heart.remove();
      }, 800);
    }

    window.toggleSave = async function(creatorId, index) {
      console.log('🔄 Toggle save called - userId:', userId, 'creatorId:', creatorId);
      
      // Check if Supabase is available
      if (!supabase) {
        console.log('⚠️ Supabase není k dispozici');
        showToast('Funkce ukládání není momentálně dostupná', 'error');
        return;
      }
      
      // Check if user is logged in
      if (!userId) {
        console.log('⚠️ No userId, checking session...');
        const { data: { session } } = await supabase.auth.getSession();
        
        if (!session?.user) {
          console.log('❌ Not logged in, redirecting...');
          window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
          return;
        }
        
        userId = session.user.id;
        await loadSavedCreators();
        console.log('✅ Session found, userId:', userId);
      }

      const isSaved = savedCreators.has(creatorId);
      const saveBtn = $(`#saveBtn${index}`);
      
      console.log('Current state - isSaved:', isSaved, 'savedCreators size:', savedCreators.size);
      
      try {
        if (isSaved) {
          // Unsave
          console.log('🗑️ Unsaving creator...');
          const { error } = await supabase
            .from('saved_creators')
            .delete()
            .eq('user_id', userId)
            .eq('creator_id', creatorId);

          if (error) {
            console.error('❌ Unsave error:', error);
            throw error;
          }

          savedCreators.delete(creatorId);
          console.log('✅ Unsaved successfully');
          showToast('Odebráno z favoritů 💔');
          trackEvent('creator_unsaved', { creator_id: creatorId });
        } else {
          // Save with flying heart animation
          console.log('❤️ Saving creator...');
          
          // Use upsert to avoid duplicate errors
          const { data, error } = await supabase
            .from('saved_creators')
            .upsert({
              user_id: userId,
              creator_id: creatorId,
              created_at: new Date().toISOString()
            }, {
              onConflict: 'user_id,creator_id'
            });

          if (error) {
            console.error('❌ Save error:', error);
            console.error('Error details:', JSON.stringify(error, null, 2));
            showToast('Chyba: ' + (error.message || 'Nelze uložit'), 'error');
            return;
          }

          savedCreators.add(creatorId);
          console.log('✅ Saved successfully, new size:', savedCreators.size);
          
          // Trigger flying heart effect
          createFlyingHeart(saveBtn);
          
          showToast('Uloženo do favoritů ❤️');
          trackEvent('creator_saved', { creator_id: creatorId });
        }

        // Update button appearance
        const heartIcon = saveBtn.querySelector('i');
        const btnText = saveBtn.querySelector('span');
        const btnContainer = saveBtn.querySelector('div');
        
        if (savedCreators.has(creatorId)) {
          // Add burst animation to button
          btnContainer.classList.add('heart-burst');
          setTimeout(() => btnContainer.classList.remove('heart-burst'), 500);
          
          // Fade out text (likes count)
          if (btnText) btnText.classList.add('fade-out-text');
          
          setTimeout(() => {
            btnContainer.className = 'h-10 w-10 rounded-full bg-red-500/20 backdrop-blur-sm border border-red-500/50 flex items-center justify-center hover:scale-110 transition-transform';
            if (heartIcon) {
              heartIcon.className = 'h-5 w-5 text-red-500';
              heartIcon.style.fill = 'currentColor'; // Force fill
            }
            if (btnText) {
              // Increment likes count
              const currentCount = parseInt(btnText.textContent) || 37;
              btnText.textContent = currentCount + 1;
              btnText.classList.remove('fade-out-text');
            }
            lucide.createIcons();
          }, 400);
        } else {
          btnContainer.className = 'h-10 w-10 rounded-full bg-black/40 backdrop-blur-sm border border-white/20 flex items-center justify-center hover:scale-110 transition-transform';
          if (heartIcon) {
            heartIcon.className = 'h-5 w-5 text-white';
            heartIcon.style.fill = 'none'; // Remove fill
          }
          if (btnText) {
            // Decrement likes count
            const currentCount = parseInt(btnText.textContent) || 38;
            btnText.textContent = Math.max(0, currentCount - 1);
          }
          lucide.createIcons();
        }
      } catch (error) {
        console.error('❌ Error toggling save:', error);
        showToast('Chyba při ukládání', 'error');
      }
    };

        // Verified filter

    // Touch gestures for better mobile experience
    function setupTouchGestures() {
      const container = $('#reelsContainer');
      
      container.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndY = e.changedTouches[0].clientY;
        handleSwipe();
      }, { passive: true });
    }

    function handleSwipe() {
      const swipeThreshold = 50;
      const diff = touchStartY - touchEndY;

      if (Math.abs(diff) > swipeThreshold) {
        if (diff > 0) {
          // Swipe up - next reel
          trackEvent('swipe_up', { from_index: currentIndex });
        } else {
          // Swipe down - previous reel
          trackEvent('swipe_down', { from_index: currentIndex });
        }
      }
    }

    // Keyboard navigation
    function setupKeyboardNavigation() {
      document.addEventListener('keydown', (e) => {
        const container = $('#reelsContainer');
        const screenHeight = window.innerHeight;

        switch(e.key) {
          case 'ArrowUp':
            e.preventDefault();
            container.scrollBy({ top: -screenHeight, behavior: 'smooth' });
            break;
          case 'ArrowDown':
            e.preventDefault();
            container.scrollBy({ top: screenHeight, behavior: 'smooth' });
            break;
          case ' ':
            e.preventDefault();
            toggleVideoPlay(null, currentIndex);
            break;
          case 'Escape':
            window.history.back();
            break;
        }
      });
    }

        closeBtn.style.width = '40px';
        closeBtn.classList.remove('opacity-0');
        closeBtn.classList.add('opacity-100');
        
        // Hide search icon, show X
        searchIconBtn.style.width = '0';
        searchIconBtn.style.opacity = '0';
        
        // Focus without scrolling
        $(`#searchInputInline${index}`).focus({ preventScroll: true });
        lucide.createIcons();
      }, 150);
      
      trackEvent('search_opened', { reel_index: index });
    };

    window.closeSearchOverlay = function(index) {
      const searchBar = $(`#searchBarInline${index}`);
      const inputWrapper = $(`#searchInputWrapper${index}`);
      const closeBtn = $(`#closeSearchInline${index}`);
      const searchIconBtn = $(`#searchIconBtn${index}`);
      const resultsOverlay = $(`#searchResults${index}`);
      
      // Hide input and close button
      inputWrapper.classList.remove('opacity-100');
      inputWrapper.classList.add('opacity-0');
      closeBtn.classList.remove('opacity-100');
      closeBtn.classList.add('opacity-0');
      
      // Show search icon again
      searchIconBtn.style.width = '40px';
      searchIconBtn.style.opacity = '1';
      
      setTimeout(() => {
        inputWrapper.style.width = '0';
        closeBtn.style.width = '0';
        
        // Collapse search bar back to icon
        searchBar.style.width = '40px';
        // Background color stays the same (bg-black/30)
      }, 150);
      
      // Hide results if exists
      if (resultsOverlay) {
        resultsOverlay.classList.add('hidden');
        resultsOverlay.innerHTML = `
          <div class="bg-black/95 backdrop-blur-xl rounded-2xl border border-white/20 p-4">
            <div class="text-white/60 text-sm text-center py-8">
              Začni psát pro vyhledávání...
            </div>
          </div>
        `;
      }
      
      // Clear input
      $(`#searchInputInline${index}`).value = '';
      
      trackEvent('search_closed', { reel_index: index });
    };

    window.handleSearchInput = function(index, query) {
      searchQuery = query.toLowerCase().trim();
      const resultsContainer = $(`#searchResults${index}`);

      if (!searchQuery) {
        resultsContainer.classList.add('hidden');
        return;
      }

      // Filter reels based on search query
      filteredReels = allReels.filter(reel => {
        return reel.name?.toLowerCase().includes(searchQuery) ||
          reel.handle?.toLowerCase().includes(searchQuery) ||
          reel.bio?.toLowerCase().includes(searchQuery) ||
          (reel.categories || []).some(cat => cat.toLowerCase().includes(searchQuery)) ||
          (reel.platforms || []).some(p => p.toLowerCase().includes(searchQuery));
      });

      // Show results
      resultsContainer.classList.remove('hidden');
      
      if (filteredReels.length === 0) {
        resultsContainer.innerHTML = `
          <div class="bg-black/95 backdrop-blur-xl rounded-2xl border border-white/20 p-4">
            <div class="text-white/60 text-sm text-center py-8">
              Žádné výsledky pro "${query}"
            </div>
          </div>
        `;
        return;
      }

      // Display results
      resultsContainer.innerHTML = `
        <div class="bg-black/95 backdrop-blur-xl rounded-2xl border border-white/20 p-4">
          <div class="text-white/80 text-xs font-semibold mb-3">${filteredReels.length} ${filteredReels.length === 1 ? 'výsledek' : 'výsledků'}</div>
          <div class="space-y-2">
            ${filteredReels.map((reel, i) => `
              <button onclick="jumpToReel(${allReels.indexOf(reel)})" class="w-full flex items-center gap-3 p-3 rounded-xl bg-white/5 hover:bg-white/10 transition text-left">
                <div class="h-12 w-12 rounded-full bg-gradient-to-br from-fuchsia-600 to-purple-600 flex items-center justify-center flex-shrink-0">
                  <span class="text-white font-bold text-sm">${reel.name[0]}</span>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="text-white font-semibold text-sm truncate">${reel.name}</div>
                  <div class="text-white/60 text-xs truncate">${reel.handle}</div>
                </div>
                <i data-lucide="arrow-right" class="h-4 w-4 text-white/40"></i>
              </button>
            `).join('')}
          </div>
        </div>
      `;
      
      lucide.createIcons();
      trackEvent('search_performed', { query: searchQuery, results: filteredReels.length, reel_index: index });
    };

    function performSearch(query) {
      // Deprecated - kept for backwards compatibility
      searchQuery = query.toLowerCase().trim();
      const resultsContainer = $('#searchResults');

      if (!resultsContainer) return;
      
      if (!searchQuery) {
        resultsContainer.classList.add('hidden');
        return;
      }

      // Filter reels based on search query
      filteredReels = allReels.filter(reel => {
        return reel.name?.toLowerCase().includes(searchQuery) ||
          reel.handle?.toLowerCase().includes(searchQuery) ||
          reel.bio?.toLowerCase().includes(searchQuery) ||
          (reel.categories || []).some(cat => cat.toLowerCase().includes(searchQuery)) ||
          (reel.platforms || []).some(p => p.toLowerCase().includes(searchQuery));
      });

      resultsContainer.classList.remove('hidden');
      displaySearchResults(filteredReels);
      trackEvent('search_performed', { query: searchQuery, results: filteredReels.length });
    }

    function displaySearchResults(results) {
      const resultsContainer = $('#searchResults');
      
      if (results.length === 0) {
        resultsContainer.innerHTML = `
          <div class="bg-black/95 backdrop-blur-xl rounded-2xl border border-white/20 p-4">
            <div class="text-white/60 text-sm text-center py-8">
              <i data-lucide="search-x" class="h-12 w-12 mx-auto mb-3 opacity-50"></i>
              <p>Žádné výsledky</p>
              <p class="text-xs mt-2">Zkus jiný výraz</p>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      resultsContainer.innerHTML = `
        <div class="bg-black/95 backdrop-blur-xl rounded-2xl border border-white/20 p-4">
          <div class="text-white/80 text-sm mb-3">
            Nalezeno <span class="font-bold">${results.length}</span> tvůrců
          </div>
          <div class="grid gap-3">
          ${results.map((reel, index) => `
            <button onclick="jumpToReel('${reel.id}')" class="flex items-center gap-3 p-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 transition text-left">
              <div class="h-14 w-14 rounded-full bg-gradient-to-br from-fuchsia-500/30 to-purple-500/30 flex items-center justify-center text-xl font-bold flex-shrink-0">
                ${reel.name?.charAt(0) || '?'}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <span class="font-semibold truncate">${reel.name}</span>
                  ${reel.premium ? '<i data-lucide="crown" class="h-3.5 w-3.5 text-yellow-400 flex-shrink-0"></i>' : ''}
                  ${reel.verified ? '<i data-lucide="check-circle" class="h-3.5 w-3.5 text-blue-400 flex-shrink-0"></i>' : ''}
                </div>
                <div class="text-xs text-white/60 truncate">${reel.handle || ''}</div>
                <div class="flex items-center gap-2 mt-1 text-xs text-white/50">
                  <span class="flex items-center gap-1">
                    <i data-lucide="users" class="h-3 w-3"></i>
                    ${formatNumber(reel.followers_count)}
                  </span>
                  ${(reel.platforms || []).slice(0, 3).map(p => {
                    const icons = { instagram: 'instagram', tiktok: 'video', youtube: 'youtube', facebook: 'facebook' };
                    return `<i data-lucide="${icons[p] || 'circle'}" class="h-3 w-3"></i>`;
                  }).join('')}
                </div>
              </div>
              <i data-lucide="chevron-right" class="h-5 w-5 text-white/40 flex-shrink-0"></i>
            </button>
          `).join('')}
          </div>
        </div>
      `;
      
      lucide.createIcons();
    }

    window.jumpToReel = function(reelId) {
      const reelIndex = allReels.findIndex(r => r.id === reelId);
      if (reelIndex === -1) return;

      const container = $('#reelsContainer');
      const screenHeight = window.innerHeight;
      
      closeSearchOverlay();
      
      setTimeout(() => {
        container.scrollTo({
          top: reelIndex * screenHeight,
          behavior: 'smooth'
        });
        
        trackEvent('jump_to_reel', { reel_id: reelId, from_search: true });
      }, 300);
    };

    // Setup search event listeners
    function setupSearchListeners() {
      const searchInput = $('#searchInputInline');
      const closeBtn = $('#closeSearchInline');
      const searchBar = $('#searchBarInline');
      
      if (!searchInput) return;
      
      // Search input
      let searchTimeout;
      searchInput.addEventListener('input', (e) => {
        const value = e.target.value;
        
        // Debounce search
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          performSearch(value);
        }, 300);
      });

      // Close button
      if (closeBtn) {
        closeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeSearchOverlay();
        });
      }

      // ESC to close
      document.addEventListener('keydown', (e) => {
        const currentWidth = parseFloat(searchBar.style.width.replace('px', ''));
        if (e.key === 'Escape' && currentWidth > 40) {
          closeSearchOverlay();
        }
      });
    }

    // Setup filter listeners
    function setupFilterListeners() {
      // Type segments
      $$('.seg-reels').forEach(btn => {
        btn.addEventListener('click', () => {
          $$('.seg-reels').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          reelsFilters.type = btn.dataset.seg;
        });
      });

      // Platforms
      $$('.pill-reels').forEach(btn => {
        btn.addEventListener('click', () => {
          btn.classList.toggle('active');
          const plat = btn.dataset.plat;
          if (reelsFilters.platforms.includes(plat)) {
            reelsFilters.platforms = reelsFilters.platforms.filter(p => p !== plat);
          } else {
            reelsFilters.platforms.push(plat);
          }
        });
      });

      // Topics
      $$('.tagBtn-reels').forEach(btn => {
        btn.addEventListener('click', () => {
          btn.classList.toggle('active');
          const topic = btn.dataset.topic;
          if (reelsFilters.topics.includes(topic)) {
            reelsFilters.topics = reelsFilters.topics.filter(t => t !== topic);
          } else {
            reelsFilters.topics.push(topic);
          }
        });
      });

      // Region
      const regionSelect = $('#regionReels');
      if (regionSelect) {
        regionSelect.addEventListener('change', () => {
          reelsFilters.region = regionSelect.value;
        });
      }

      // Followers slider
      const followersSlider = $('#followersReels');
      const followersVal = $('#followersValReels');
      if (followersSlider && followersVal) {
        followersSlider.addEventListener('input', () => {
          const val = parseInt(followersSlider.value);
          reelsFilters.minFollowers = val;
          followersVal.textContent = val >= 500000 ? '500k+' : (val >= 1000 ? Math.round(val/1000) + 'k' : val);
        });
      }

      // Verified checkbox
      const verifiedCheck = $('#verifiedReels');
      if (verifiedCheck) {
        verifiedCheck.addEventListener('change', () => {
          reelsFilters.verified = verifiedCheck.checked;
        });
      }

      // Reset button
      const resetBtn = $('#resetReels');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          reelsFilters = {
            type: 'creator',
            platforms: [],
            topics: [],
            region: 'all',
            minFollowers: 0,
            verified: false
          };
          
          // Reset UI
          $$('.seg-reels').forEach(b => b.classList.remove('active'));
          $$('.seg-reels[data-seg="creator"]').forEach(b => b.classList.add('active'));
          $$('.pill-reels').forEach(b => b.classList.remove('active'));
          $$('.tagBtn-reels').forEach(b => b.classList.remove('active'));
          if (regionSelect) regionSelect.value = 'all';
          if (followersSlider) followersSlider.value = '0';
          if (followersVal) followersVal.textContent = '0';
          if (verifiedCheck) verifiedCheck.checked = false;
          
          // Reset display to all reels
          displayReels(allReels);
          updateFiltersBadge();
          
          showToast('Filtry resetovány');
        });
      }
    }

    // Init
    async function init() {
      await checkAuth();
      await loadReels();
      setupTouchGestures();
      setupKeyboardNavigation();
      setupSearchListeners();
      setupFilterListeners();
      
      // Track session
      trackEvent('reels_session_started');
    }

    init();
  </script>
</body>
</html>
